name: Generate JSDoc

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Generate JSDoc
        run: npm run docs

      - name: Upload documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: jsdoc-site
          path: docs
